name: Check ELEMENTAL iOS Build

on:
  workflow_dispatch:

jobs:
  ios-check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle executable
        run: chmod +x gradlew

      - name: Show iOS Gradle tasks
        run: ./gradlew :ios:tasks --console=plain

      # A real installable/TestFlight IPA requires Apple signing.
      # After certificates + provisioning profile are configured,
      # the final command is normally:
      # ./gradlew :ios:createIPA --console=plain --stacktrace
